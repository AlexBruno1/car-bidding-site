# Local development database. Production uses a managed PostgreSQL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: car_bidding
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d car_bidding"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
